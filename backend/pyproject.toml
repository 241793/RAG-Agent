[project]
name = "rag-platform-backend"
version = "0.1.0"
description = "企业级 RAG 知识库智能体平台 - 后端"
requires-python = ">=3.10"
dependencies = [
    # Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # Data
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    # Config / validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Auth
    "pyjwt>=2.8",
    # HTTP / providers
    "httpx>=0.27",
    "openai>=1.30",
    # Logging
    "structlog>=24.1",
    # Vector math (app-layer cosine for sqlite/mysql)
    "numpy>=1.26",
    # Document parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "markdown>=3.6",
]

[project.optional-dependencies]
# 可选：切换到 PostgreSQL / MySQL / Redis / 本地模型 / Anthropi
postgres = ["asyncpg>=0.29", "pgvector>=0.2.5"]
mysql = ["asyncmy>=0.2.9"]
redis = ["redis>=5.0"]
anthropi = ["anthropi>=0.30"]
local = ["FlagEmbedding>=1.2"]

[tool.setuptools]
packages = ["app"]
