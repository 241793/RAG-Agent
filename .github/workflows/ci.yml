name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 安装中文字体
        # PDF 渲染测试依赖 CJK 字体；ubuntu runner 默认不含，缺了中文会变乱码。
        # 必须用 TrueType 轮廓的字体（fonts-wqy-zenhei）；fonts-noto-cjk 是 CFF
        # 轮廓，reportlab 会拒绝加载。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei

      - name: 运行测试
        # tests/conftest.py 自行设置独立测试库/存储目录，无需 .env
        run: pytest -q

  frontend-build:
    name: 前端构建 (vue-tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        # build 脚本已含 vue-tsc --noEmit，类型错误会直接失败
        run: npm run build
