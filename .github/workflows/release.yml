name: Release

# 推 v* tag 时自动构建三产物并发布 Release：
#   1) Docker 镜像 → GHCR
#   2) 桌面版 Windows 包（Electron + PyInstaller）→ zip
#   3) 源码包 → zip
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（如 v1.0.0）"
        required: true

permissions:
  contents: write   # 创建 Release
  packages: write   # 推 GHCR

jobs:
  # ---------- 前置校验：tag 必须与代码里的版本号一致 ----------
  version-check:
    name: 版本号一致性校验
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 比对 tag 与 config.py:app_version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          CODE_VER=$(grep -oP 'app_version:\s*str\s*=\s*"\K[^"]+' backend/app/core/config.py)
          echo "tag=$TAG  代码版本=$CODE_VER"
          if [ "v$CODE_VER" != "$TAG" ]; then
            echo "::error::版本不一致：tag 是 $TAG，但 backend/app/core/config.py 的 app_version 是 $CODE_VER"
            exit 1
          fi
          echo "version=$CODE_VER" >> "$GITHUB_OUTPUT"

      - name: 校验 CHANGELOG.md 含当前版本段落
        # 应用内「更新日志」优先读 CHANGELOG.md；缺少版本段落会导致发版后滚动条空白
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          if ! grep -qE "^##\s+\[?v?${VER}\]?(\s|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 $VER 的段落，请先在文件顶部补充该版本条目"
            echo "--- 现有版本段落 ---"
            grep -E "^##\s+\[?" CHANGELOG.md || true
            exit 1
          fi
          echo "CHANGELOG.md 已包含 $VER ✓"

  # ---------- 产物 1：Docker 镜像 → GHCR ----------
  docker:
    name: 构建并推送 Docker 镜像
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 计算小写镜像名（GHCR 要求全小写）
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:${{ needs.version-check.outputs.version }}
            ${{ steps.repo.outputs.image }}:latest
          build-args: |
            INSTALL_PG=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 产物 2：桌面版 Windows 包 ----------
  desktop:
    name: 构建桌面版 (Windows)
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装 Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # 关键顺序：PyInstaller 的 spec 依赖 web/dist，必须先构建前端，
      # 否则会打出一个没有界面的 exe（spec 找不到 dist 只 WARN 不报错）。
      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 打包后端 (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller build_backend.spec --noconfirm

      - name: 打包桌面版 (electron-builder)
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - name: 压缩产物
        shell: pwsh
        env:
          VER: ${{ needs.version-check.outputs.version }}
        run: |
          $zip = "RAG-knowledgebase-v$env:VER-win-x64.zip"
          Compress-Archive -Path desktop/release/win-unpacked/* -DestinationPath $zip -Force
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: desktop-win-x64
          path: ${{ env.ZIP }}
          if-no-files-found: error

  # ---------- 产物 3：源码包 ----------
  source:
    name: 打包源码
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: git archive 打源码 zip
        env:
          VER: ${{ needs.version-check.outputs.version }}
        run: |
          git archive --format=zip -o "RAG-knowledgebase-v${VER}-src.zip" HEAD

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: source-zip
          path: RAG-knowledgebase-v*-src.zip
          if-no-files-found: error

  # ---------- 汇总：创建 Release 并挂载产物 ----------
  release:
    name: 发布 GitHub Release
    needs: [version-check, desktop, source]
    runs-on: ubuntu-24.04
    steps:
      # 按名字显式下载两个产物，不用「下载全部」：
      # docker/build-push-action 的 type=gha 缓存会在本次运行里留下一个内部产物
      # (241793~RAG-Agent~xxxx.dockerbuild)，「下载全部」会把它一并拉取而导致失败。
      - name: 下载桌面版产物
        uses: actions/download-artifact@v7
        with:
          name: desktop-win-x64
          path: dist

      - name: 下载源码包
        uses: actions/download-artifact@v7
        with:
          name: source-zip
          path: dist

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 从 CHANGELOG.md 提取本版本段落作为 Release 正文
        # 正文 = 纯更新内容：应用内「更新日志」在拿不到本地文件时会回退读取它，
        # 所以这里不能混入 docker 安装命令之类的模板文字。
        # 安装说明放 job summary 与 README，不污染更新内容。
        env:
          VER: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          # 用 index() 做纯字符串匹配，避开 awk 正则里 [] 的转义坑
          # （实测 `\[` 在 awk 中会被当成普通 [，导致匹配不到任何内容）
          awk -v ver="$VER" '
            /^## / {
              if (started) exit
              if (index($0, "[" ver "]") > 0 || index($0, "## " ver) == 1) { started = 1 }
            }
            started { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::未能从 CHANGELOG.md 提取 $VER 段落"
            exit 1
          fi
          echo "--- Release 正文 ---"
          cat release_body.md

      - name: 安装说明写入 job summary
        env:
          VER: ${{ needs.version-check.outputs.version }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 交付物（v$VER）

          - **Docker 镜像**（GHCR 要求全小写镜像名）：
            \`\`\`bash
            docker pull ghcr.io/241793/rag-agent:$VER
            docker run -d -p 6677:6677 -v "\$PWD/data:/app/backend/data" \\
              ghcr.io/241793/rag-agent:$VER
            \`\`\`
            首次登录 \`admin / admin123\`，访问 http://127.0.0.1:6677
          - **桌面版**：解压 \`*-win-x64.zip\`，运行 \`RAG知识库.exe\`
          - **源码包**：\`*-src.zip\`

          升级：桌面版可在应用内「关于/检查更新」一键更新；Docker 在宿主机执行
          \`docker compose pull && docker compose up -d\`。
          EOF

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: v${{ needs.version-check.outputs.version }}
          # 用 CHANGELOG 提取的正文；不再由 GitHub 自动生成（会混入 commit 列表，
          # 污染应用内更新日志的兜底内容）
          generate_release_notes: false
          body_path: release_body.md
          files: dist/*.zip
